<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <title>Sign In</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/knockout/3.3.0/knockout-min.js" integrity="sha512-B/MRvt89+YMD5k8dP+oQWMkEZndkvG6iiavSiVaEZ7Evf4kVYQxHIakn88N2/XTz/IAXsvSc42MD3Uyq99XL5A==" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/URI.js/1.18.9/URI.min.js" integrity="sha512-hKzV1skyo714+BKD4fK4926EGH07VJkb9VGl0E04IWryK360PNgkhdOERlVYmClniY1zyFwPTGjfph7iR91kQQ==" crossorigin="anonymous"></script>
<body>
    <div id="anonymous1" style="display: none;">
        <div>
            <a href="/" data-bind="attr: { href: url }" id="signIn1">Sign In</a>
        </div>
    </div>
    <div id="authenticated1" style="display: none;">
        <div>
            <span data-bind="text: welcomeMessage"></span>
        </div>
        <div>
            <button type="button" id="signOut1" data-bind="click: signOut">Sign Out</button>
        </div>
    </div>
    <script>
        jQuery(document).ready(() => {
            var anonymousUserViewModel = function (url) {

                this.url = url;
            };
            var authenticatedUserViewModel = function (user) {
                this.welcomeMessage = ko.pureComputed(() => `Welcome ${user.displayName}`);
                this.signOut = () => {
                    jQuery.ajax({
                        type: 'GET',
                        url: '/users/current/csrfToken'
                    })
                        .then(({ csrfToken }) => jQuery.ajax({
                            contentType: 'application/json; charset=utf-8',
                            type: 'POST',
                            url: '/users/signOut',
                            headers: { 'x-csrf-token': csrfToken }
                        }))
                        .always(() => {
                            window.location = '/';
                        });
                };
            };

            function authenticated(user) {
                ko.applyBindings(new authenticatedUserViewModel(user), document.getElementById('authenticated1'));
                jQuery("#authenticated1").fadeIn();
            }

            function anonymous() {
                jQuery.ajax({
                    contentType: 'application/json; charset=utf-8',
                    type: 'GET',
                    url: '/destiny/signIn'
                })
                    .done((url) => {
                        ko.applyBindings(new anonymousUserViewModel(url), document.getElementById('anonymous1'));
                        jQuery("#anonymous1").fadeIn();
	                    window.history.replaceState(null, null, window.location.pathname);
                    });
            }

            var uri = new URI(jQuery(location).attr('href'));
            if (uri.query(true).code) {
                jQuery.ajax({
                    contentType: 'application/json; charset=utf-8',
                    type: 'GET',
                    url: `/users/signin/bungie${uri.search()}`
                })
                    .done(authenticated)
                    .fail(anonymous);
            } else {
                jQuery.ajax({
                    contentType: 'application/json; charset=utf-8',
                    type: 'GET',
                    url: '/users/current'
                })
                    .done(authenticated)
                    .fail(anonymous);
            }
        });
    </script>
</body>
</html>
